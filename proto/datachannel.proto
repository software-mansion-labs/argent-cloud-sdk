// Canonical input-command schema spoken over the MoQ "control" track.
//
// Source of truth: simulator-server's `proto/datachannel.proto` (radon-ide).
// This copy exists so the encoder in `src/proto/encoder.ts` can be checked
// against a real protobuf implementation in tests. It is NOT parsed at runtime.
// If the server schema changes, update this file and the encoder together —
// the parity test will fail until they agree.

syntax = "proto3";

package datachannel;

enum TouchAction {
  TOUCH_DOWN = 0;
  TOUCH_UP = 1;
  TOUCH_MOVE = 2;
}

enum KeyAction {
  KEY_DOWN = 0;
  KEY_UP = 1;
}

enum ButtonType {
  BUTTON_HOME = 0;
  BUTTON_BACK = 1;
  BUTTON_POWER = 2;
  BUTTON_VOLUME_UP = 3;
  BUTTON_VOLUME_DOWN = 4;
  BUTTON_APP_SWITCH = 5;
  BUTTON_ACTION = 6;
}

enum RotateDirection {
  ROTATE_PORTRAIT = 0;
  ROTATE_PORTRAIT_UPSIDE_DOWN = 1;
  ROTATE_LANDSCAPE_LEFT = 2;
  ROTATE_LANDSCAPE_RIGHT = 3;
}

message TouchCommand {
  TouchAction action = 1;
  double x = 2;
  double y = 3;
  optional double second_x = 4;
  optional double second_y = 5;
}

message KeyCommand {
  KeyAction action = 1;
  int32 code = 2;
}

message ButtonCommand {
  KeyAction action = 1;
  ButtonType button = 2;
}

message RotateCommand {
  RotateDirection direction = 1;
}

message WheelCommand {
  double x = 1;
  double y = 2;
  double dx = 3;
  double dy = 4;
}

enum DownscalerType {
  DOWNSCALER_LANCZOS3 = 0;
  DOWNSCALER_BOX = 1;
  DOWNSCALER_BILINEAR = 2;
  DOWNSCALER_NEAREST = 3;
}

message ScreenshotCommand {
  optional string id = 1;
  optional RotateDirection rotation = 2;
  optional float scale = 3;
  optional DownscalerType downscaler = 4;
}

message TouchPointer {
  int32 id = 1;
  double x = 2;
  double y = 3;
}

// Full snapshot of the currently-active touch pointers. Downs and ups are
// implicit: a pointer appearing in the list means it is touching, disappearing
// means it lifted. The receiver diffs consecutive snapshots, so intermediate
// snapshots may be dropped in transit (latest-wins) without corrupting state.
message TouchStateCommand {
  repeated TouchPointer pointers = 1;
}

message DataChannelCommand {
  oneof command {
    TouchCommand touch = 1;
    KeyCommand key = 2;
    ButtonCommand button = 3;
    RotateCommand rotate = 4;
    WheelCommand wheel = 5;
    ScreenshotCommand screenshot = 6;
    TouchStateCommand touch_state = 7;
  }
}
