name: publish-sdk

# This repository and workflow name are configured in npmjs as the trusted
# publisher for @swmansion/argent-cloud-sdk — do not rename this file without
# updating that trusted-publisher config.

on:
  # Cutting an `x.y-stable` branch publishes that release automatically. The
  # action reads major.minor from the branch name and picks the patch by
  # querying the registry, so `0.2-stable` publishes 0.2.0, and cutting it
  # again later would publish 0.2.1.
  create:
  workflow_dispatch:
    inputs:
      release-type:
        description: Type of release to publish
        type: choice
        options: [stable, nightly, beta, alpha, rc]
        default: stable
      version:
        description: Explicit version in x.y.z format (optional)
        type: string
        required: false
        default: ''
      dry-run:
        description: Dry run — no actual publish or git push
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest

    # `create` also fires for tags — including the `v<version>` tag this
    # workflow pushes itself, which would otherwise re-trigger it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.ref_type == 'branch' && endsWith(github.event.ref, '-stable'))

    permissions:
      contents: write # push the release commit and the v<version> tag
      id-token: write # required for OIDC / npm provenance

    concurrency:
      group: publish-sdk-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Publish release (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: software-mansion/npm-package-publish@bbfbcdf3f27e2dc288d7d56f5989a731efc79e6f
        with:
          package-name: '@swmansion/argent-cloud-sdk'
          package-json-path: 'package.json'
          install-dependencies-command: 'npm ci'
          perform-git-operations: true
          release-type: ${{ inputs.release-type }}
          version: ${{ inputs.version }}
          dry-run: ${{ inputs.dry-run }}

      - name: Publish release (stable branch cut)
        if: github.event_name == 'create'
        uses: software-mansion/npm-package-publish@bbfbcdf3f27e2dc288d7d56f5989a731efc79e6f
        with:
          package-name: '@swmansion/argent-cloud-sdk'
          package-json-path: 'package.json'
          install-dependencies-command: 'npm ci'
          perform-git-operations: true
          release-type: 'stable'
          dry-run: false
